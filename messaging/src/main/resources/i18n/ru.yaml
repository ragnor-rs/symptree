bot.symptom.reprompt.null_pick: "Не получилось распознать ответ. Выберите, пожалуйста, один из вариантов."
bot.symptom.reprompt.non_symptom_intent: "Похоже, ваш вопрос не про симптомы. Если хотите продолжить, выберите вариант из меню."
