# FR-VWRNDR — Russian view-layer catalog (the single frontend i18n source).
#
# Flat Map<String, String> keyed by dot-notation paths (loaded by
# com.symptree.messaging.i18n.MessageCatalog.loadFromClasspath). One disjoint key
# set spanning BOTH paths: ingress chrome + reminder/feedback/booking-outgoing.
# Keep in lockstep with kk.yaml — same key set, language-specific values.
# {param} tokens are interpolated by the renderer.

# --- Welcome + goal-pick menu -------------------------------------------------
bot.welcome.text: "Здравствуйте! Я помогу разобраться с симптомами и записаться к врачу."
bot.welcome.menu_prompt: "Чем я могу вам помочь?"
bot.welcome.goal.symptom_consultation: "🩺 Разобраться с симптомами"
bot.welcome.goal.appointment_booking: "📅 Записаться к врачу"
bot.welcome.goal.service_info: "ℹ️ Узнать об услугах"
bot.welcome.unknown_goal: "Не удалось распознать выбор. Пожалуйста, выберите вариант из меню."

