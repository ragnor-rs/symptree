server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck target (nginx alpine has no curl; the check uses wget).
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Reverse-proxy the REST surface to core. The /api prefix is PRESERVED (core
    # routes live under /api/v1/...), so no rewrite — the SPA calls same-origin
    # /api/... and nginx forwards to the core service over the compose network.
    location /api/ {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any unknown route serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
